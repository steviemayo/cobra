name: Gateway Windows bundle

# Builds the self-contained Windows gateway (its own Node, the panel app, the install scripts) and
# publishes it as a rolling release per channel. The installer and the daily update task read from
# these releases:
#   main -> release "gateway-stable"
#   dev  -> release "gateway-beta" (pre-release)
# Pull requests only check that the bundle builds.
on:
  pull_request:
    paths:
      - 'apps/gateway/**'
      - 'apps/panel/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/gateway-windows.yml'
  push:
    branches: [main, dev]
    paths:
      - 'apps/gateway/**'
      - 'apps/panel/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/gateway-windows.yml'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@kestrel/gateway..." --filter "@kestrel/panel-app..."
      - run: pnpm --filter @kestrel/panel-app build
      - name: Assemble the bundle
        run: |
          # Native modules (serial ports) are installed for this platform, which is why this runs on Windows.
          # A flat node_modules keeps paths short enough for Windows PowerShell 5.1 to unzip on the gateway.
          pnpm --config.node-linker=hoisted --filter @kestrel/gateway deploy --prod bundle/app
          Copy-Item -Recurse apps/panel/dist bundle/app/panel
          Copy-Item -Recurse apps/gateway/windows bundle/app/windows
          $version = (Select-String -Path apps/gateway/src/config.ts -Pattern "GATEWAY_VERSION = '([^']+)'").Matches[0].Groups[1].Value
          Set-Content -Path bundle/app/VERSION -Value $version -NoNewline
          $node = (node -v)
          Invoke-WebRequest "https://nodejs.org/dist/$node/node-$node-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-extract
          New-Item -ItemType Directory bundle/app/runtime | Out-Null
          Copy-Item "node-extract/node-$node-win-x64/node.exe" bundle/app/runtime/node.exe
          Compress-Archive -Path bundle/app/* -DestinationPath kestrel-gateway-win-x64.zip
          Copy-Item bundle/app/VERSION VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: kestrel-gateway-win-x64
          path: kestrel-gateway-win-x64.zip
      - name: Publish to the channel's release
        if: github.event_name != 'pull_request' && github.ref_name != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $channel = if ('${{ github.ref_name }}' -eq 'main') { 'stable' } else { 'beta' }
          $tag = "gateway-$channel"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            $flags = if ($channel -eq 'beta') { @('--prerelease') } else { @() }
            gh release create $tag --title "Gateway ($channel)" --notes "Rolling $channel build of the Kestrel gateway for Windows." --target '${{ github.sha }}' @flags
          }
          # VERSION goes last: the update task reads it first, so it must never point at a missing bundle.
          gh release upload $tag kestrel-gateway-win-x64.zip --clobber
          gh release upload $tag VERSION --clobber
