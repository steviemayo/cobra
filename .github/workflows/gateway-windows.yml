name: Gateway Windows bundle

# Builds the self-contained Windows gateway (its own Node, the panel app, the install scripts), the
# WinSW service wrapper, and the KestrelGatewaySetup.exe installer (Inno Setup, preinstalled on
# windows-latest), then publishes them as a rolling release per channel. The installer, install.ps1
# and the daily update task read from these releases:
#   main -> release "gateway-stable"
#   dev  -> release "gateway-beta" (pre-release)
# Pull requests only check that the bundle and installer build.
on:
  pull_request:
    paths:
      - 'apps/gateway/**'
      - 'apps/panel/**'
      - 'packages/**'
      - '!packages/db/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/gateway-windows.yml'
  push:
    branches: [main, dev]
    paths:
      - 'apps/gateway/**'
      - 'apps/panel/**'
      - 'packages/**'
      - '!packages/db/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/gateway-windows.yml'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@kestrel/gateway..." --filter "@kestrel/panel-app..."
      - run: pnpm --filter @kestrel/panel-app build
      - name: Assemble the bundle
        run: |
          # Native modules (serial ports) are installed for this platform, which is why this runs on Windows.
          # A flat node_modules keeps paths short enough for Windows PowerShell 5.1 to unzip on the gateway.
          pnpm --config.node-linker=hoisted --filter @kestrel/gateway deploy --prod bundle/app
          Copy-Item -Recurse apps/panel/dist bundle/app/panel
          Copy-Item -Recurse apps/gateway/windows bundle/app/windows
          $version = (Select-String -Path apps/gateway/src/config.ts -Pattern "GATEWAY_VERSION = '([^']+)'").Matches[0].Groups[1].Value
          Set-Content -Path bundle/app/VERSION -Value $version -NoNewline
          $node = (node -v)
          Invoke-WebRequest "https://nodejs.org/dist/$node/node-$node-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-extract
          New-Item -ItemType Directory bundle/app/runtime | Out-Null
          Copy-Item "node-extract/node-$node-win-x64/node.exe" bundle/app/runtime/node.exe
          Compress-Archive -Path bundle/app/* -DestinationPath kestrel-gateway-win-x64.zip
          Copy-Item bundle/app/VERSION VERSION
      - name: Sign the bundle (the release key exists only in this workflow's secrets)
        if: github.event_name != 'pull_request'
        env:
          GATEWAY_RELEASE_SIGNING_KEY: ${{ secrets.GATEWAY_RELEASE_SIGNING_KEY }}
        run: |
          # Gateways install a bundle only if this signature checks out, so an unsigned one is never published.
          if (-not $env:GATEWAY_RELEASE_SIGNING_KEY) {
            Write-Error 'GATEWAY_RELEASE_SIGNING_KEY is not set, so the bundle cannot be signed and will not be published.'
            exit 1
          }
          $version = (Get-Content VERSION).Trim()
          pnpm --filter @kestrel/gateway exec tsx scripts/sign-release.ts "$PWD/kestrel-gateway-win-x64.zip" $version
          # The same check update.ps1 makes on the gateway, against the public key committed in the repo:
          # catches a secret that does not belong to it before gateways find out.
          pnpm --filter @kestrel/gateway exec node --disable-warning=ExperimentalWarning --import tsx windows/verify-bundle.ts "$PWD/kestrel-gateway-win-x64.zip" "$PWD/kestrel-gateway-win-x64.zip.sig" $version
      - name: Bundle the service wrapper (WinSW, MIT licensed)
        run: |
          # Runs as a real Windows service. The plain .NET-Framework build needs no runtime install
          # (Framework 4 ships with Windows), unlike the newer .NET-based v3 builds.
          Invoke-WebRequest "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW.NET4.exe" `
            -OutFile bundle/app/windows/KestrelGatewayService.exe
      - name: Build the installer (KestrelGatewaySetup.exe)
        run: |
          $version = Get-Content VERSION
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DCloudUrlDefault=${{ vars.GATEWAY_CLOUD_URL_DEFAULT }}" `
            "/DSourceDir=$PWD\bundle\app" `
            "/DOutputDir=$PWD" `
            apps/gateway/windows/setup.iss
      # A pull request only needs to prove the bundle and installer build; nothing downloads these,
      # so uploading them would just spend the org's Actions artifact storage for no reason.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: kestrel-gateway-win-x64
          path: kestrel-gateway-win-x64.zip
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: KestrelGatewaySetup
          path: KestrelGatewaySetup.exe
      - name: Publish to the channel's release
        if: github.event_name != 'pull_request' && github.ref_name != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $channel = if ('${{ github.ref_name }}' -eq 'main') { 'stable' } else { 'beta' }
          $tag = "gateway-$channel"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            # Built with += so it stays an array: `$x = if (...) { @('--prerelease') }` unrolls to a plain
            # string, and splatting a string passes one character at a time (gh read "-" as a file to upload).
            $flags = @()
            if ($channel -eq 'beta') { $flags += '--prerelease' }
            gh release create $tag --title "Gateway ($channel)" --notes "Rolling $channel build of the Kestrel gateway for Windows." --target '${{ github.sha }}' @flags
          }
          # VERSION goes last: the update task reads it first, so it must never point at a missing bundle.
          gh release upload $tag kestrel-gateway-win-x64.zip --clobber
          # The signature goes straight after the bundle it belongs to.
          gh release upload $tag kestrel-gateway-win-x64.zip.sig --clobber
          gh release upload $tag KestrelGatewaySetup.exe --clobber
          gh release upload $tag VERSION --clobber
