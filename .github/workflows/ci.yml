name: CI
# Minutes are limited, so this runs once per change: on the pull request, and not again on the push
# that merges it (the merge adds no new code). A new push to a pull request cancels the run still
# going for the old one. Changes to docs or to .github alone skip it (workflow files are checked by reading them). Run it by hand from the Actions tab if needed.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/**'
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# No job needs to write anything back to the repo or to packages; the default for every job below
# is read-only unless a job says otherwise.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kestrel/db generate
        env:
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
