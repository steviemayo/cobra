name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
# No job needs to write anything back to the repo or to packages; the default for every job below
# is read-only unless a job says otherwise.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kestrel/db generate
        env:
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The ignored advisories (pnpm-workspace.yaml, auditConfig.ignoreGhsas) all come from
      # `prisma`'s own bundled Studio/CLI dependency tree (lodash, mysql2, deepmerge-ts), pulled in
      # through @prisma/client even for a Postgres-only, Studio-never-launched app; nothing here
      # calls into them. A new advisory anywhere else, including a new one in this same package,
      # still fails the build. Re-check the ignore list whenever Prisma is upgraded.
      - run: pnpm audit --prod
