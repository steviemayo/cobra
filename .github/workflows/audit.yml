name: Audit
# The dependency audit only has something new to say when the dependencies change (or when a new
# advisory is published), so it runs for pull requests that touch them, and once a week.
on:
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '**/package.json'
  schedule:
    - cron: '0 3 * * 1' # Monday 03:00 UTC
  workflow_dispatch:
concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The ignored advisories (pnpm-workspace.yaml, auditConfig.ignoreGhsas) all come from
      # `prisma`'s own bundled Studio/CLI dependency tree (lodash, mysql2, deepmerge-ts), pulled in
      # through @prisma/client even for a Postgres-only, Studio-never-launched app; nothing here
      # calls into them. A new advisory anywhere else, including a new one in this same package,
      # still fails the build. Re-check the ignore list whenever Prisma is upgraded.
      - run: pnpm audit --prod
