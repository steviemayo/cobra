name: CodeQL

# Static analysis for the TypeScript/JavaScript across the whole workspace (portal, gateway, panel,
# packages). Code scanning is not turned on for this private repo, so the upload half of the
# analysis fails and nothing shows under the Security tab: every run so far was minutes spent for no
# result (it was the largest single cost in Actions). It now runs by hand only. When code scanning is
# turned on (Settings > Code security, or the repo goes public), put the weekly schedule back:
#   schedule:
#     - cron: '0 3 * * 1'
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
