name: CodeQL

# Static analysis for the TypeScript/JavaScript across the whole workspace (portal, gateway, panel,
# packages). Findings show up under the repo's Security tab, not as a blocking check.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 3 * * 1' # once a week, Monday 03:00 UTC

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
      # Code scanning isn't turned on for this (private) repo yet, so the upload half of this step
      # fails every run ("Code scanning is not enabled for this repository"). Non-blocking (on the
      # step itself, so the check reports green) until that's turned on in Settings > Code
      # security, matching this workflow's own stated intent above ("not as a blocking check").
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
