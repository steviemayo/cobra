name: Gateway image

# Builds the gateway container. Pull requests only check that it builds; pushes publish to GHCR.
#   main            -> :stable (and :latest)
#   dev             -> :beta
#   gateway-v1.2.3  -> :1.2.3
on:
  pull_request:
    paths:
      - 'apps/gateway/**'
      - 'apps/panel/**'
      - 'packages/**'
      - '!packages/db/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/gateway-image.yml'
  push:
    branches: [main, dev]
    tags: ['gateway-v*']
    paths:
      - 'apps/gateway/**'
      - 'apps/panel/**'
      - 'packages/**'
      - '!packages/db/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/gateway-image.yml'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kestrel-gateway

# Neither job needs to write anything back to the repo; `image` grants itself `packages: write` on
# top of this, and only on a push (a pull request never has that permission at all).
permissions:
  contents: read

jobs:
  # A gateway build ships whatever @kestrel/model version is current, but a gateway only ever
  # updates itself when it sees a *different* GATEWAY_VERSION (the Windows installer's update.ps1
  # compares it directly; Docker/Watchtower updates on image digest regardless, but the Gateways
  # page's "Update available" badge also reads it). Forgetting to bump it means a room's manifest
  # can silently outgrow what an already-installed gateway can parse ("invalid_manifest").
  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: GATEWAY_VERSION must change alongside the gateway
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          # A change to CI files alone (an action bump, say) changes nothing an installed gateway runs.
          if [ -z "$(git diff --name-only "$BASE_SHA" | grep -v '^\.github/')" ]; then
            echo "Only CI files changed: no gateway release is needed."
            exit 0
          fi
          if git diff "$BASE_SHA" -- apps/gateway/src/config.ts | grep -q '^[+-].*GATEWAY_VERSION'; then
            echo "GATEWAY_VERSION was bumped."
          else
            echo "::error file=apps/gateway/src/config.ts::This PR changes the gateway, the panel or a package it bundles, but GATEWAY_VERSION was not bumped. Bump it in apps/gateway/src/config.ts (and apps/gateway/package.json to match) so already-installed gateways detect this release and update."
            exit 1
          fi

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/dev' }}
            type=match,pattern=gateway-v(.*),group=1
            type=sha
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/gateway/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
