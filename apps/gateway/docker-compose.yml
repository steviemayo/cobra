# Kestrel gateway, updated from the portal.
#
#   1. Copy this file to the gateway machine and create a .env next to it:
#        KESTREL_CLOUD_URL=https://<your kestrel app>
#        KESTREL_ENROLL_TOKEN=<token from the portal, first start only>
#        KESTREL_CHANNEL=stable          # or beta
#        KESTREL_IMAGE=ghcr.io/<org>/kestrel-gateway
#        KESTREL_UPDATE_TOKEN=<any long random string; shared by the gateway and Watchtower>
#   2. docker compose up -d
#
# Watchtower does not check for new images on its own. When the portal asks this gateway to update
# (now, at a time you pick, or automatically if you turn that on for it), the gateway asks Watchtower
# over its update API, and Watchtower pulls the image for the chosen channel and restarts only the
# gateway container. The /data volume (credential, cached releases, buffered telemetry) is kept, and
# rooms carry on from their cached releases while the container restarts.
services:
  gateway:
    image: ${KESTREL_IMAGE:?set KESTREL_IMAGE}:${KESTREL_CHANNEL:-stable}
    container_name: kestrel-gateway
    restart: unless-stopped
    # Host networking lets trusted-IP panel access see each panel's real address.
    network_mode: host
    environment:
      KESTREL_CLOUD_URL: ${KESTREL_CLOUD_URL:?set KESTREL_CLOUD_URL}
      KESTREL_ENROLL_TOKEN: ${KESTREL_ENROLL_TOKEN:-}
      KESTREL_SIMULATE: ${KESTREL_SIMULATE:-off}
      # How the gateway asks Watchtower to update it (Watchtower publishes this on the host only).
      KESTREL_UPDATE_URL: http://127.0.0.1:18080/v1/update
      KESTREL_UPDATE_TOKEN: ${KESTREL_UPDATE_TOKEN:?set KESTREL_UPDATE_TOKEN}
    volumes:
      - kestrel-data:/data
    labels:
      com.centurylinklabs.watchtower.enable: 'true'

  watchtower:
    image: containrrr/watchtower:latest
    container_name: kestrel-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Reachable from this machine only.
    ports:
      - '127.0.0.1:18080:8080'
    environment:
      # Update only when asked (no periodic polling): the portal decides when.
      WATCHTOWER_HTTP_API_UPDATE: 'true'
      WATCHTOWER_HTTP_API_TOKEN: ${KESTREL_UPDATE_TOKEN:?set KESTREL_UPDATE_TOKEN}
      WATCHTOWER_LABEL_ENABLE: 'true'
      WATCHTOWER_CLEANUP: 'true'

volumes:
  kestrel-data:
